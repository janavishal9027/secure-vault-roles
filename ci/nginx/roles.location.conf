# nginx location snippet for the roles service.
#
# NOTE: the roles service is internal — only Authentication calls it via
# Feign on the cluster network. Deploying this snippet exposes /roles/*
# publicly, which is only useful for Swagger access or operator debugging.
# In prod you may prefer to skip installing this file; see the note in
# ci/deploy-remote.sh on how to opt out.
#
# Dropped into /etc/nginx/snippets/${KUBE_NAMESPACE}/ on the VPS by
# ci/deploy-remote.sh. /roles/* beats the UI's catch-all "/" via nginx's
# most-specific match.
#
# ${LXD_BRIDGE_IP} is substituted at deploy time by ci/deploy.sh.
location /roles/ {
    proxy_pass         http://${LXD_BRIDGE_IP}:80;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
